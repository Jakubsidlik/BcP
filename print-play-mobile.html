<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print&Play - Mobilní zobrazení</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pdf-scale: 1;
      --brand: #0051d5;
    }

    body {
      font-family: "Times New Roman", Times, serif;
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
    }

    .pdf-scale-layer {
      transform: scale(var(--pdf-scale));
      transform-origin: top center;
      transition: transform 180ms ease;
    }

    .pdf-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .pdf-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-slate-200">
    <div class="px-3 pt-2 pb-1">
      <p class="text-[15px] leading-tight font-bold tracking-tight">Bakalářská práce</p>
      <p class="text-[11px] leading-tight text-slate-600 mt-0.5">Autor: Jakub Šidlík • 2026</p>
      <p class="text-[11px] leading-tight text-slate-600">Vedoucí práce: Mgr. Petr Liška. PhD</p>
      <p class="text-[11px] leading-tight text-slate-600">Ústav matematiky a statistiky MUNI</p>
    </div>
    <div class="px-4 py-1 flex justify-between items-center border-t border-slate-200">
      <a id="download-print-mobile-top" aria-label="Stáhnout Print&Play PDF" class="text-slate-600 hover:bg-slate-100 rounded-full p-1 transition-colors flex" href="assets/pdf/print-play.pdf" download>
        <span class="material-symbols-outlined text-[20px]">download</span>
      </a>
      <div class="flex items-center gap-1">
        <button id="zoom-out" aria-label="Zmenšit" class="text-slate-600 hover:bg-slate-100 rounded-full p-1 transition-colors">
        <span class="material-symbols-outlined text-[20px]">zoom_out</span>
        </button>
        <div id="zoom-label" class="text-xs text-slate-700 px-1">100%</div>
        <button id="zoom-in" aria-label="Zvětšit" class="text-slate-600 hover:bg-slate-100 rounded-full p-1 transition-colors">
          <span class="material-symbols-outlined text-[20px]">zoom_in</span>
        </button>
      </div>
    </div>
    <div class="h-[2px] bg-[var(--brand)]"></div>
  </header>

  <main class="px-0 pt-0 pb-20 h-[calc(100vh-152px)] overflow-y-auto pdf-scroll bg-white">
    <div class="pdf-scale-layer w-full">
      <div class="bg-white">
        <iframe
          id="printplay-frame"
          title="Náhled Print&Play"
          src="about:blank"
          class="w-full h-[72vh] min-h-[420px] border-0 rounded-none"
        ></iframe>
        <p class="text-xs text-slate-500 mt-3 px-3">
          Pokud se PDF nenačte, otevřete jej ve samostatném okně.
        </p>
        <div id="print-missing-pdf" class="hidden mt-3 mx-3 border border-red-200 bg-red-50 text-red-700 px-3 py-2 rounded-lg text-sm">
          Pokud se PDF nenačte, otevřete jej ve samostatném okně.
        </div>
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0F172A] border-t border-slate-700 h-14 px-3 flex items-center justify-around">
    <a href="https://jakubsidlik.github.io/BC_hra_M/" target="_blank" rel="noopener noreferrer" aria-label="Hra Math4fun" class="text-slate-300 hover:text-white transition-colors w-11 h-11 rounded-xl flex items-center justify-center">
      <span class="material-symbols-outlined text-[24px]">videogame_asset</span>
    </a>

    <a href="index-mobile.html" aria-label="Bakalářská práce" class="text-slate-300 hover:text-white transition-colors w-11 h-11 rounded-xl flex items-center justify-center bg-slate-800">
      <span class="material-symbols-outlined text-[24px]">description</span>
    </a>

    <a href="print-play-mobile.html" aria-label="Print and Play" class="text-white bg-blue-600 shadow-[0_6px_22px_rgba(0,81,213,0.45)] w-11 h-11 rounded-xl flex items-center justify-center">
      <span class="material-symbols-outlined text-[24px]">casino</span>
    </a>
  </nav>

  <script>
    const PRINT_PDF_PATH = "assets/pdf/print-play.pdf";
    const printFrame = document.getElementById("printplay-frame");
    const printMissingPdf = document.getElementById("print-missing-pdf");
    const printMobileDownload = document.getElementById("download-print-mobile-top");
    const zoomLabel = document.getElementById("zoom-label");
    const root = document.documentElement;
    let zoom = 1;

    if (window.matchMedia("(min-width: 901px)").matches) {
      window.location.replace("print-play.html");
    }

    async function ensurePrintPdf() {
      printFrame.src = PRINT_PDF_PATH + "#view=FitH";

      if (window.location.protocol === "file:") {
        return;
      }

      try {
        const response = await fetch(PRINT_PDF_PATH, { method: "HEAD", cache: "no-store" });
        if (!response.ok) {
          printMissingPdf.classList.remove("hidden");
          printMobileDownload.classList.add("opacity-50", "pointer-events-none");
          printMobileDownload.setAttribute("aria-disabled", "true");
          printMobileDownload.removeAttribute("href");
        }
      } catch (error) {
        // Keep iframe visible when HEAD check is unavailable.
      }
    }

    function setZoom(newZoom) {
      zoom = Math.min(1.5, Math.max(0.75, newZoom));
      root.style.setProperty("--pdf-scale", zoom.toFixed(2));
      zoomLabel.textContent = Math.round(zoom * 100) + "%";
    }

    document.getElementById("zoom-in").addEventListener("click", function () {
      setZoom(zoom + 0.1);
    });

    document.getElementById("zoom-out").addEventListener("click", function () {
      setZoom(zoom - 0.1);
    });

    ensurePrintPdf();
  </script>
</body>
</html>
